<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Mains electricity route</title>
  <desc id="desc">Electricity travels from a power station along power lines on pylons to a house, with a save electricity note.</desc>
  <rect width="900" height="600" fill="#f8fafc" />
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#0f172a">Mains electricity reaches homes and schools</text>

  <rect x="70" y="330" width="190" height="130" fill="#e2e8f0" stroke="#64748b" stroke-width="4" />
  <rect x="95" y="290" width="45" height="170" fill="#cbd5e1" stroke="#64748b" stroke-width="4" />
  <rect x="165" y="260" width="45" height="200" fill="#cbd5e1" stroke="#64748b" stroke-width="4" />
  <path d="M105 275 C90 245 130 235 120 205" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
  <path d="M177 245 C160 218 205 205 194 175" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
  <text x="165" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Power station</text>

  <g stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M365 455 L415 220 L465 455 Z" />
    <path d="M385 360 H445" />
    <path d="M375 415 H455" />
    <path d="M398 220 H432" />
    <path d="M405 455 L415 360 L425 455" />
  </g>
  <text x="415" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Pylon</text>

  <g stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M570 455 L620 220 L670 455 Z" />
    <path d="M590 360 H650" />
    <path d="M580 415 H660" />
    <path d="M603 220 H637" />
    <path d="M610 455 L620 360 L630 455" />
  </g>
  <text x="620" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Power lines</text>

  <line x1="210" y1="230" x2="415" y2="220" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <line x1="210" y1="255" x2="415" y2="245" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <line x1="415" y1="220" x2="620" y2="220" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <line x1="415" y1="245" x2="620" y2="245" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <line x1="620" y1="220" x2="770" y2="320" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" />
  <line x1="620" y1="245" x2="770" y2="345" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2563eb">electricity travels this way</text>

  <polygon points="710,355 795,285 880,355" fill="#fecaca" stroke="#b91c1c" stroke-width="4" />
  <rect x="730" y="355" width="130" height="100" fill="#fee2e2" stroke="#b91c1c" stroke-width="4" />
  <rect x="780" y="395" width="35" height="60" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" />
  <rect x="742" y="375" width="30" height="28" fill="#fef3c7" stroke="#ca8a04" stroke-width="3" />
  <rect x="823" y="375" width="30" height="28" fill="#fef3c7" stroke="#ca8a04" stroke-width="3" />
  <text x="795" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Home / school</text>

  <rect x="315" y="95" width="270" height="58" rx="18" fill="#ecfdf5" stroke="#22c55e" stroke-width="4" />
  <text x="450" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">Save electricity: switch off</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>
</svg>
