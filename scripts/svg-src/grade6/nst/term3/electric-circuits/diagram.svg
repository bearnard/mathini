<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Closed electric circuit</title>
  <desc id="desc">A simple closed circuit loop with labelled cell, bulb, switch and wires.</desc>
  <rect width="900" height="600" fill="#f8fafc" />
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Simple closed circuit</text>

  <path d="M210 300 H330 M390 300 H510 M570 300 H690 M690 300 V440 H210 V300" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <line x1="330" y1="250" x2="330" y2="350" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
  <line x1="390" y1="270" x2="390" y2="330" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
  <text x="360" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">Cell</text>
  <text x="360" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">energy source</text>

  <circle cx="540" cy="300" r="50" fill="#fef3c7" stroke="#92400e" stroke-width="8" />
  <line x1="510" y1="270" x2="570" y2="330" stroke="#92400e" stroke-width="6" stroke-linecap="round" />
  <line x1="570" y1="270" x2="510" y2="330" stroke="#92400e" stroke-width="6" stroke-linecap="round" />
  <path d="M515 250 Q540 225 565 250" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <text x="540" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">Bulb</text>
  <text x="540" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">lights up</text>

  <circle cx="210" cy="300" r="8" fill="#0f172a" />
  <circle cx="210" cy="440" r="8" fill="#0f172a" />
  <line x1="210" y1="300" x2="270" y2="440" stroke="#16a34a" stroke-width="10" stroke-linecap="round" />
  <text x="170" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#15803d">Closed switch</text>
  <text x="170" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">path is joined</text>

  <text x="450" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#334155">Connecting wires make a complete path for current</text>
  <path d="M715 410 c30 -20 48 -54 48 -92" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="745" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2563eb">current flows</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>
</svg>
