<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Circuit symbols chart</title>
  <desc id="desc">A labelled chart of standard symbols for a cell, battery, lamp, open switch, closed switch and wire.</desc>
  <rect width="900" height="600" fill="#f8fafc" />
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Standard circuit symbols</text>

  <g font-family="Arial, sans-serif" font-size="22" fill="#0f172a" stroke="#1e293b" stroke-linecap="round">
    <rect x="70" y="95" width="340" height="125" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3" />
    <line x1="180" y1="132" x2="180" y2="188" stroke-width="7" />
    <line x1="220" y1="145" x2="220" y2="175" stroke-width="4" />
    <line x1="135" y1="160" x2="180" y2="160" stroke-width="5" />
    <line x1="220" y1="160" x2="265" y2="160" stroke-width="5" />
    <text x="310" y="168" stroke="none" font-weight="700">Cell</text>

    <rect x="490" y="95" width="340" height="125" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3" />
    <line x1="575" y1="132" x2="575" y2="188" stroke-width="7" />
    <line x1="610" y1="145" x2="610" y2="175" stroke-width="4" />
    <line x1="645" y1="132" x2="645" y2="188" stroke-width="7" />
    <line x1="680" y1="145" x2="680" y2="175" stroke-width="4" />
    <line x1="535" y1="160" x2="575" y2="160" stroke-width="5" />
    <line x1="680" y1="160" x2="720" y2="160" stroke-width="5" />
    <text x="750" y="168" stroke="none" font-weight="700">Battery</text>

    <rect x="70" y="250" width="340" height="125" rx="18" fill="#fefce8" stroke="#fde047" stroke-width="3" />
    <line x1="130" y1="312" x2="175" y2="312" stroke-width="5" />
    <circle cx="220" cy="312" r="42" fill="none" stroke-width="5" />
    <line x1="193" y1="285" x2="247" y2="339" stroke-width="5" />
    <line x1="247" y1="285" x2="193" y2="339" stroke-width="5" />
    <line x1="262" y1="312" x2="305" y2="312" stroke-width="5" />
    <text x="330" y="320" stroke="none" font-weight="700">Lamp</text>

    <rect x="490" y="250" width="340" height="125" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3" />
    <line x1="535" y1="312" x2="590" y2="312" stroke-width="5" />
    <circle cx="590" cy="312" r="6" fill="#1e293b" stroke="none" />
    <circle cx="690" cy="312" r="6" fill="#1e293b" stroke="none" />
    <line x1="595" y1="304" x2="670" y2="270" stroke-width="5" />
    <line x1="690" y1="312" x2="735" y2="312" stroke-width="5" />
    <text x="640" y="350" text-anchor="middle" stroke="none" font-weight="700">Open switch</text>

    <rect x="70" y="405" width="340" height="125" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3" />
    <line x1="115" y1="468" x2="170" y2="468" stroke-width="5" />
    <circle cx="170" cy="468" r="6" fill="#1e293b" stroke="none" />
    <circle cx="270" cy="468" r="6" fill="#1e293b" stroke="none" />
    <line x1="175" y1="465" x2="270" y2="468" stroke-width="5" />
    <line x1="270" y1="468" x2="315" y2="468" stroke-width="5" />
    <text x="250" y="505" text-anchor="middle" stroke="none" font-weight="700">Closed switch</text>

    <rect x="490" y="405" width="340" height="125" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3" />
    <line x1="535" y1="468" x2="710" y2="468" stroke-width="5" />
    <text x="755" y="476" stroke="none" font-weight="700">Wire</text>
  </g>
</svg>
