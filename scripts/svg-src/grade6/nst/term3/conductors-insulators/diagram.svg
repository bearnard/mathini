<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Conductors and insulators test circuit</title>
  <desc id="desc">A test circuit with a gap for test material, a lit bulb for a conductor, and examples of conductors and insulators.</desc>
  <rect width="900" height="600" fill="#f8fafc" />
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#0f172a">Testing conductors and insulators</text>

  <path d="M155 325 V455 H690 V325" fill="none" stroke="#334155" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M155 325 H300" fill="none" stroke="#334155" stroke-width="11" stroke-linecap="round" />
  <path d="M420 325 H510" fill="none" stroke="#334155" stroke-width="11" stroke-linecap="round" />
  <path d="M610 325 H690" fill="none" stroke="#334155" stroke-width="11" stroke-linecap="round" />

  <line x1="145" y1="365" x2="145" y2="445" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
  <line x1="180" y1="382" x2="180" y2="428" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <text x="160" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Cell</text>

  <circle cx="560" cy="325" r="50" fill="#fde68a" stroke="#b45309" stroke-width="8" />
  <line x1="530" y1="295" x2="590" y2="355" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
  <line x1="590" y1="295" x2="530" y2="355" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
  <path d="M520 275 Q560 232 600 275" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />
  <text x="560" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#b45309">Bulb lit</text>
  <text x="560" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">test item conducts</text>

  <rect x="300" y="292" width="120" height="66" rx="12" fill="#bbf7d0" stroke="#15803d" stroke-width="5" />
  <text x="360" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Test</text>
  <text x="360" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">material</text>
  <text x="360" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d">Conductor in gap</text>

  <rect x="75" y="95" width="330" height="115" rx="20" fill="#ecfdf5" stroke="#22c55e" stroke-width="4" />
  <text x="240" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Conductors</text>
  <text x="240" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#166534">Most metals let current pass</text>
  <text x="240" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#166534">copper • aluminium • iron</text>

  <rect x="495" y="95" width="330" height="115" rx="20" fill="#fff1f2" stroke="#fb7185" stroke-width="4" />
  <text x="660" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#be123c">Insulators</text>
  <text x="660" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#be123c">Do not let current pass easily</text>
  <text x="660" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#be123c">plastic • rubber • dry wood • glass</text>

  <text x="450" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#334155">If the bulb is off, the test material is an insulator</text>
</svg>
