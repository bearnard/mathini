<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Earth and Moon movement</title>
  <desc id="desc">Earth revolves around the Sun, rotates on its axis, and the Moon orbits Earth.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <circle cx="150" cy="310" r="72" fill="#fbbf24"/>
  <circle cx="150" cy="310" r="48" fill="#f97316" opacity="0.4"/>
  <text x="150" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#92400e">Sun</text>
  <ellipse cx="520" cy="310" rx="340" ry="205" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="12 10"/>
  <path d="M 690 132 A 340 205 0 0 1 785 177" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="525" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#334155">revolution: Earth orbits the Sun once a year</text>
  <g transform="translate(655 385)">
    <circle r="62" fill="#2563eb"/>
    <path d="M-40 -15c25 16 55 14 83 -4M-32 28c28 -12 56 -11 82 5" fill="none" stroke="#22c55e" stroke-width="9" stroke-linecap="round"/>
    <line x1="-28" y1="-78" x2="28" y2="78" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <path d="M -50 -82 A 64 64 0 0 1 48 -74" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#blueArrow)"/>
    <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a" stroke="#f8fafc" stroke-width="7" paint-order="stroke">Earth</text>
    <text x="0" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e40af" stroke="#f8fafc" stroke-width="7" paint-order="stroke">rotation: spins once a day</text>
    <ellipse rx="130" ry="86" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M 112 -38 A 130 86 0 0 1 126 15" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="135" cy="0" r="20" fill="#cbd5e1"/>
    <text x="165" y="7" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#475569" stroke="#f8fafc" stroke-width="7" paint-order="stroke">Moon</text>
    <text x="0" y="-112" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569" stroke="#f8fafc" stroke-width="7" paint-order="stroke">Moon orbits Earth about monthly</text>
  </g>
</svg>
