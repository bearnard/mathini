<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">The Solar System</title>
  <desc id="desc">The Sun on the left and the eight planets in correct order from Mercury to Neptune.</desc>
  <rect width="1200" height="520" fill="#0f172a"/>
  <g fill="#e2e8f0" opacity="0.8">
    <circle cx="180" cy="70" r="2"/>
    <circle cx="360" cy="115" r="2"/>
    <circle cx="570" cy="70" r="2"/>
    <circle cx="780" cy="125" r="2"/>
    <circle cx="1010" cy="70" r="2"/>
    <circle cx="1120" cy="160" r="2"/>
    <circle cx="250" cy="430" r="2"/>
    <circle cx="650" cy="455" r="2"/>
    <circle cx="1040" cy="430" r="2"/>
  </g>
  <circle cx="40" cy="260" r="118" fill="#fbbf24"/>
  <circle cx="40" cy="260" r="90" fill="#f97316" opacity="0.38"/>
  <text x="40" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fde68a">Sun</text>
  <line x1="150" y1="260" x2="1140" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="10 12"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="21" font-weight="700" fill="#f8fafc">
    <circle cx="185" cy="260" r="14" fill="#a3a3a3"/>
    <text x="185" y="315">Mercury</text>
    <circle cx="290" cy="260" r="22" fill="#f59e0b"/>
    <text x="290" y="325">Venus</text>
    <circle cx="405" cy="260" r="24" fill="#2563eb"/>
    <path d="M390 248c12 7 25 7 38 0M390 275c13-6 27-6 40 1" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <text x="405" y="335">Earth</text>
    <circle cx="525" cy="260" r="19" fill="#dc2626"/>
    <text x="525" y="323">Mars</text>
    <circle cx="685" cy="260" r="48" fill="#d97706"/>
    <path d="M645 247h80M640 269h88" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <text x="685" y="342">Jupiter</text>
    <g transform="translate(850 260)">
      <ellipse rx="72" ry="18" fill="none" stroke="#fcd34d" stroke-width="8" transform="rotate(-12)"/>
      <circle r="39" fill="#eab308"/>
    </g>
    <text x="850" y="350">Saturn</text>
    <circle cx="1010" cy="260" r="31" fill="#67e8f9"/>
    <text x="1010" y="340">Uranus</text>
    <circle cx="1130" cy="260" r="30" fill="#3b82f6"/>
    <text x="1130" y="340">Neptune</text>
  </g>
  <text x="600" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">8 planets orbit the Sun</text>
</svg>
