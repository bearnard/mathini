<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Day, night and seasons</title>
  <desc id="desc">Sun rays shine on one side of a tilted Earth, showing day, night and axis tilt causing seasons.</desc>
  <defs>
    <clipPath id="earthClip">
      <circle cx="650" cy="310" r="135"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <circle cx="130" cy="310" r="82" fill="#fbbf24"/>
  <circle cx="130" cy="310" r="55" fill="#f97316" opacity="0.35"/>
  <text x="130" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#92400e">Sun</text>
  <g stroke="#f59e0b" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="230" y1="210" x2="470" y2="240"/>
    <line x1="230" y1="310" x2="470" y2="310"/>
    <line x1="230" y1="410" x2="470" y2="380"/>
  </g>
  <text x="360" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#d97706">Sun rays</text>
  <circle cx="650" cy="310" r="135" fill="#2563eb"/>
  <g clip-path="url(#earthClip)">
    <rect x="650" y="175" width="140" height="270" fill="#0f172a" opacity="0.58"/>
    <path d="M565 245c35 15 70 14 105-2M555 355c44-18 90-15 126 8" fill="none" stroke="#22c55e" stroke-width="13" stroke-linecap="round"/>
    <path d="M684 228c25 12 47 11 73-2M684 384c28-12 53-11 77 6" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  </g>
  <circle cx="650" cy="310" r="135" fill="none" stroke="#1e293b" stroke-width="4"/>
  <line x1="596" y1="150" x2="704" y2="470" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <text x="536" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#f59e0b">Day side</text>
  <text x="786" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#334155">Night side</text>
  <text x="650" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#dc2626">tilted axis</text>
  <text x="650" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">axis tilt causes seasons</text>
</svg>
