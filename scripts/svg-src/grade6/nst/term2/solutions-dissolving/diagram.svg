<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Sugar dissolving in water</title>
  <desc id="desc">A labelled glass of water showing solute, solvent, and solution.</desc>
  <rect width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Sugar dissolving in water</text>

  <path d="M285 112 L475 112 L445 425 L315 425 Z" fill="#ffffff" stroke="#475569" stroke-width="5"/>
  <path d="M306 218 C350 198 410 238 456 214 L438 405 L322 405 Z" fill="#7dd3fc" opacity="0.75"/>
  <path d="M306 218 C350 198 410 238 456 214" fill="none" stroke="#0284c7" stroke-width="4"/>

  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
    <rect x="226" y="140" width="22" height="22" rx="3"/>
    <rect x="242" y="178" width="20" height="20" rx="3"/>
    <rect x="213" y="205" width="18" height="18" rx="3"/>
  </g>
  <path d="M244 205 C282 230 320 248 360 270" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="7 8"/>

  <g fill="#fef3c7" stroke="#f59e0b" stroke-width="2">
    <circle cx="349" cy="284" r="5"/>
    <circle cx="382" cy="264" r="4"/>
    <circle cx="408" cy="300" r="5"/>
    <circle cx="356" cy="338" r="4"/>
    <circle cx="424" cy="354" r="4"/>
    <circle cx="390" cy="377" r="5"/>
  </g>

  <path d="M470 135 C530 185 510 275 450 320" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M450 320 L425 300" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>

  <text x="90" y="178" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">solute</text>
  <text x="90" y="207" font-family="Arial, sans-serif" font-size="18" fill="#92400e">sugar</text>
  <line x1="178" y1="172" x2="232" y2="151" stroke="#92400e" stroke-width="3" marker-end="url(#arrowBrown)"/>

  <text x="545" y="222" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0369a1">solvent</text>
  <text x="545" y="251" font-family="Arial, sans-serif" font-size="18" fill="#0369a1">water</text>
  <line x1="536" y1="218" x2="444" y2="225" stroke="#0369a1" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <text x="535" y="368" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e">solution</text>
  <text x="535" y="397" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">sugar water</text>
  <line x1="526" y1="362" x2="410" y2="365" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowTeal)"/>

  <defs>
    <marker id="arrowBrown" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#92400e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0369a1"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
