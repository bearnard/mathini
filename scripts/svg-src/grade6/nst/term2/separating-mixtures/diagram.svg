<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Filtration setup</title>
  <desc id="desc">A labelled filtration setup with funnel, filter paper, residue, beaker, and filtrate.</desc>
  <rect width="760" height="480" fill="#f8fafc"/>
  <line x1="130" y1="118" x2="630" y2="118" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <line x1="380" y1="118" x2="380" y2="398" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>

  <path d="M260 105 L500 105 L425 245 L335 245 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <path d="M305 132 L455 132 L405 224 L355 224 Z" fill="#ffffff" stroke="#64748b" stroke-width="4"/>
  <path d="M323 147 L437 147 L403 209 L357 209 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="368" cy="166" r="6" fill="#92400e"/>
  <circle cx="390" cy="185" r="5" fill="#92400e"/>
  <circle cx="406" cy="160" r="5" fill="#92400e"/>
  <circle cx="382" cy="151" r="4" fill="#92400e"/>

  <path d="M370 245 L390 245 L390 310 L370 310 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/>
  <path d="M372 310 C372 330 388 330 388 310" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <path d="M285 310 L475 310 L450 430 L310 430 Z" fill="#ffffff" stroke="#475569" stroke-width="5"/>
  <path d="M310 382 C350 365 410 399 450 378 L440 420 L320 420 Z" fill="#7dd3fc" opacity="0.85"/>
  <line x1="298" y1="348" x2="462" y2="348" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="304" y1="382" x2="456" y2="382" stroke="#cbd5e1" stroke-width="3"/>

  <text x="380" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Filtration</text>
  <text x="155" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">funnel</text>
  <line x1="230" y1="164" x2="278" y2="135" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="515" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">filter paper</text>
  <line x1="512" y1="168" x2="436" y2="151" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="515" y="224" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">residue</text>
  <line x1="508" y1="216" x2="398" y2="181" stroke="#92400e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="510" y="386" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0369a1">filtrate</text>
  <line x1="502" y1="378" x2="435" y2="390" stroke="#0369a1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="180" y="378" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">beaker</text>
  <line x1="250" y1="370" x2="308" y2="347" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="currentColor"/>
    </marker>
  </defs>
</svg>
