<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Grass to springbok to lion food chain</title>
  <desc id="desc">A labelled food chain diagram showing energy flowing from grass to springbok to lion.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#475569" />
    </marker>
  </defs>

  <rect width="960" height="360" fill="#f8fafc" />
  <text x="480" y="42" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Food chain: energy flows to the eater</text>

  <g transform="translate(95 95)">
    <rect x="0" y="0" width="180" height="170" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="3" />
    <path d="M35 120 C45 88 58 76 70 120" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" />
    <path d="M75 120 C85 70 103 55 112 120" fill="none" stroke="#15803d" stroke-width="9" stroke-linecap="round" />
    <path d="M115 120 C125 86 142 72 150 120" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" />
    <line x1="28" y1="124" x2="154" y2="124" stroke="#65a30d" stroke-width="6" stroke-linecap="round" />
    <text x="90" y="153" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#166534">Grass</text>
    <text x="90" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#166534">producer</text>
  </g>

  <line x1="305" y1="180" x2="405" y2="180" stroke="#475569" stroke-width="6" marker-end="url(#arrow)" />
  <text x="355" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">eaten by</text>

  <g transform="translate(415 95)">
    <rect x="0" y="0" width="180" height="170" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" />
    <ellipse cx="92" cy="78" rx="47" ry="26" fill="#c08457" />
    <circle cx="132" cy="62" r="19" fill="#c08457" />
    <path d="M130 42 L126 20 M140 44 L151 24" stroke="#92400e" stroke-width="5" stroke-linecap="round" />
    <circle cx="138" cy="58" r="3" fill="#111827" />
    <path d="M55 98 L45 126 M78 100 L75 128 M108 100 L112 128 M128 95 L140 122" stroke="#92400e" stroke-width="6" stroke-linecap="round" />
    <path d="M50 72 C34 62 33 47 48 42" fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round" />
    <text x="90" y="153" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#92400e">Springbok</text>
    <text x="90" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#92400e">herbivore</text>
  </g>

  <line x1="625" y1="180" x2="725" y2="180" stroke="#475569" stroke-width="6" marker-end="url(#arrow)" />
  <text x="675" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">eaten by</text>

  <g transform="translate(735 95)">
    <rect x="0" y="0" width="180" height="170" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="3" />
    <ellipse cx="85" cy="80" rx="50" ry="27" fill="#d97706" />
    <circle cx="132" cy="63" r="25" fill="#d97706" />
    <circle cx="132" cy="63" r="33" fill="none" stroke="#92400e" stroke-width="10" />
    <circle cx="124" cy="58" r="3" fill="#111827" />
    <circle cx="140" cy="58" r="3" fill="#111827" />
    <path d="M129 69 Q132 72 135 69" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />
    <path d="M48 98 L38 126 M78 102 L72 130 M108 100 L114 128 M125 93 L138 121" stroke="#92400e" stroke-width="6" stroke-linecap="round" />
    <path d="M40 73 C18 65 20 45 42 42" fill="none" stroke="#92400e" stroke-width="6" stroke-linecap="round" />
    <text x="90" y="153" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#991b1b">Lion</text>
    <text x="90" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#991b1b">carnivore</text>
  </g>

  <text x="480" y="325" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">Arrows show the direction of energy flow.</text>
</svg>
