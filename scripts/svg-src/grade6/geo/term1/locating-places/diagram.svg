<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Grid-reference map</title>
  <desc id="desc">A simple lettered and numbered grid map with a school, clinic, park, road, and river.</desc>
  <rect width="480" height="320" fill="#f8fafc" />
  <text x="240" y="32" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Locating places with a grid</text>
  <g transform="translate(78 58)">
    <rect x="0" y="0" width="300" height="210" fill="#ffffff" stroke="#334155" stroke-width="3" />
    <path d="M0 154 C40 130 74 178 112 150 C158 116 198 142 300 108" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" opacity="0.75" />
    <path d="M16 40 L284 180" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <rect x="114" y="28" width="44" height="34" rx="4" fill="#fbbf24" stroke="#92400e" stroke-width="2" />
    <text x="136" y="51" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#92400e">School</text>
    <rect x="210" y="128" width="44" height="34" rx="4" fill="#fecdd3" stroke="#be123c" stroke-width="2" />
    <text x="232" y="151" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#be123c">Clinic</text>
    <circle cx="55" cy="92" r="19" fill="#86efac" stroke="#16a34a" stroke-width="3" />
    <text x="55" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#166534">Park</text>
    <line x1="75" y1="0" x2="75" y2="210" stroke="#cbd5e1" stroke-width="2" />
    <line x1="150" y1="0" x2="150" y2="210" stroke="#cbd5e1" stroke-width="2" />
    <line x1="225" y1="0" x2="225" y2="210" stroke="#cbd5e1" stroke-width="2" />
    <line x1="0" y1="70" x2="300" y2="70" stroke="#cbd5e1" stroke-width="2" />
    <line x1="0" y1="140" x2="300" y2="140" stroke="#cbd5e1" stroke-width="2" />
    <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <text x="37.5" y="-14">A</text>
      <text x="112.5" y="-14">B</text>
      <text x="187.5" y="-14">C</text>
      <text x="262.5" y="-14">D</text>
      <text x="-18" y="41">1</text>
      <text x="-18" y="111">2</text>
      <text x="-18" y="181">3</text>
    </g>
  </g>
  <g transform="translate(395 86)" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">
    <text x="0" y="0" font-size="16" font-weight="800" fill="#0f172a">Key</text>
    <rect x="0" y="14" width="18" height="14" fill="#fbbf24" stroke="#92400e" />
    <text x="26" y="26">School</text>
    <rect x="0" y="42" width="18" height="14" fill="#fecdd3" stroke="#be123c" />
    <text x="26" y="54">Clinic</text>
    <circle cx="9" cy="78" r="9" fill="#86efac" stroke="#16a34a" />
    <text x="26" y="82">Park</text>
    <line x1="0" y1="106" x2="20" y2="106" stroke="#38bdf8" stroke-width="6" />
    <text x="26" y="110">River</text>
  </g>
</svg>
