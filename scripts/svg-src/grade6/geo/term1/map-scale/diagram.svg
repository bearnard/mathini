<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Map scale and distance</title>
  <desc id="desc">A line scale marked zero to four kilometres and a comparison of large-scale and small-scale maps.</desc>
  <rect width="480" height="320" fill="#f8fafc" />
  <text x="240" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Map scale &amp; distance</text>
  <g transform="translate(70 74)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">Line scale</text>
    <rect x="0" y="22" width="68" height="24" fill="#0f172a" />
    <rect x="68" y="22" width="68" height="24" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <rect x="136" y="22" width="68" height="24" fill="#0f172a" />
    <rect x="204" y="22" width="68" height="24" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <rect x="272" y="22" width="68" height="24" fill="#0f172a" />
    <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">
      <text x="0" y="66">0</text>
      <text x="68" y="66">1</text>
      <text x="136" y="66">2</text>
      <text x="204" y="66">3</text>
      <text x="272" y="66">4</text>
      <text x="340" y="66">km</text>
    </g>
    <line x1="0" y1="18" x2="0" y2="52" stroke="#0f172a" stroke-width="2" />
    <line x1="68" y1="18" x2="68" y2="52" stroke="#0f172a" stroke-width="2" />
    <line x1="136" y1="18" x2="136" y2="52" stroke="#0f172a" stroke-width="2" />
    <line x1="204" y1="18" x2="204" y2="52" stroke="#0f172a" stroke-width="2" />
    <line x1="272" y1="18" x2="272" y2="52" stroke="#0f172a" stroke-width="2" />
    <line x1="340" y1="18" x2="340" y2="52" stroke="#0f172a" stroke-width="2" />
  </g>
  <g transform="translate(54 178)">
    <rect x="0" y="0" width="170" height="96" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3" />
    <path d="M22 68 L70 26 L142 66" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" />
    <circle cx="70" cy="26" r="9" fill="#f97316" />
    <rect x="32" y="48" width="24" height="20" fill="#60a5fa" />
    <rect x="100" y="48" width="28" height="20" fill="#a78bfa" />
    <text x="85" y="118" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">Large-scale: more detail</text>
  </g>
  <g transform="translate(256 178)">
    <rect x="0" y="0" width="170" height="96" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="3" />
    <path d="M20 68 C54 20 98 88 150 34" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <circle cx="56" cy="40" r="7" fill="#16a34a" />
    <circle cx="118" cy="58" r="7" fill="#16a34a" />
    <text x="85" y="118" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#9a3412">Small-scale: larger area</text>
  </g>
</svg>
