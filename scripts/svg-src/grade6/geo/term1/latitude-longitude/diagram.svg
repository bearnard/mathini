<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Globe showing latitude and longitude</title>
  <desc id="desc">A globe with horizontal latitude lines, vertical longitude lines, the Equator, the Greenwich Meridian, and hemisphere labels.</desc>
  <rect width="480" height="320" fill="#f8fafc" />
  <text x="240" y="32" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Latitude &amp; longitude</text>
  <g transform="translate(240 168)">
    <circle r="112" fill="#dbeafe" stroke="#2563eb" stroke-width="4" />
    <clipPath id="globeClip"><circle r="108" /></clipPath>
    <g clip-path="url(#globeClip)">
      <path d="M-88,-30 C-56,-60 -28,-55 -4,-72 C24,-92 68,-70 84,-36 C54,-20 30,-22 4,-12 C-28,0 -58,-4 -88,-30 Z" fill="#86efac" opacity="0.95" />
      <path d="M-86,38 C-52,18 -16,28 14,16 C42,6 70,20 90,46 C58,82 10,88 -28,70 C-52,58 -68,58 -86,38 Z" fill="#bbf7d0" opacity="0.95" />
      <ellipse cx="0" cy="0" rx="108" ry="28" fill="none" stroke="#0284c7" stroke-width="2" />
      <ellipse cx="0" cy="-45" rx="94" ry="19" fill="none" stroke="#38bdf8" stroke-width="2" />
      <ellipse cx="0" cy="45" rx="94" ry="19" fill="none" stroke="#38bdf8" stroke-width="2" />
      <line x1="-108" y1="0" x2="108" y2="0" stroke="#ef4444" stroke-width="4" />
      <ellipse cx="0" cy="0" rx="32" ry="108" fill="none" stroke="#7c3aed" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="70" ry="108" fill="none" stroke="#a78bfa" stroke-width="2" />
      <line x1="0" y1="-108" x2="0" y2="108" stroke="#7c2d12" stroke-width="4" />
    </g>
    <text x="-146" y="5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626">Equator</text>
    <text x="92" y="-94" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">Greenwich</text>
    <text x="92" y="-76" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">Meridian</text>
    <text x="0" y="-126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Northern Hemisphere</text>
    <text x="0" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Southern Hemisphere</text>
  </g>
  <text x="98" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0284c7">latitude = horizontal</text>
  <text x="374" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed">longitude = vertical</text>
</svg>
