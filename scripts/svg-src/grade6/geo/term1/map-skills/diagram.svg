<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Compass rose with eight directions</title>
  <desc id="desc">A colourful compass rose labelled north, south, east, west, north-east, north-west, south-east, and south-west.</desc>
  <rect width="480" height="320" fill="#f8fafc" />
  <text x="240" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Compass rose: directions on a map</text>
  <g transform="translate(240 170)">
    <circle r="94" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3" />
    <path d="M0,-118 L18,-24 L0,-42 L-18,-24 Z" fill="#2563eb" />
    <path d="M0,118 L18,24 L0,42 L-18,24 Z" fill="#60a5fa" />
    <path d="M118,0 L24,18 L42,0 L24,-18 Z" fill="#0ea5e9" />
    <path d="M-118,0 L-24,18 L-42,0 L-24,-18 Z" fill="#0ea5e9" />
    <path d="M84,-84 L30,-10 L10,-30 Z" fill="#67e8f9" />
    <path d="M-84,-84 L-30,-10 L-10,-30 Z" fill="#67e8f9" />
    <path d="M84,84 L30,10 L10,30 Z" fill="#67e8f9" />
    <path d="M-84,84 L-30,10 L-10,30 Z" fill="#67e8f9" />
    <circle r="12" fill="#f8fafc" stroke="#1e40af" stroke-width="3" />
    <text x="0" y="-130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#1e3a8a">N</text>
    <text x="0" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#1e3a8a">S</text>
    <text x="140" y="7" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#1e3a8a">E</text>
    <text x="-140" y="7" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#1e3a8a">W</text>
    <text x="104" y="-100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e">NE</text>
    <text x="-104" y="-100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e">NW</text>
    <text x="104" y="110" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e">SE</text>
    <text x="-104" y="110" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e">SW</text>
  </g>
</svg>
