<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">South Africa trade case studies</title>
  <desc id="desc">A simple South Africa outline with export icons for gold, fruit, wine, and cars, plus import arrows for oil and electronics.</desc>
