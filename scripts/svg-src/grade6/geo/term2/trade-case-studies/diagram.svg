  <path d="M330 190 C375 150 465 145 540 164 C604 180 655 225 680 290 C654 318 613 331 560 337 C532 360 493 384 445 384 C407 384 374 370 348 345 C303 344 258 329 235 294 C253 250 286 220 330 190Z" fill="#dcfce7" stroke="#16a34a" stroke-width="6" filter="url(#soft-shadow)" />
