<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Climate belts from Equator to poles</title>
  <desc id="desc">A colourful labelled cross-section showing polar, temperate, desert, and tropical climate zones from north pole through the Equator to south pole.</desc>
  <rect width="900" height="520" rx="28" fill="#f8fafc"/>
  <text x="450" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b">Climate regions by latitude</text>

  <g transform="translate(90 85)">
    <rect x="0" y="0" width="720" height="54" rx="18" fill="#dbeafe"/>
    <text x="360" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Polar: very cold, ice and snow</text>

    <rect x="0" y="58" width="720" height="64" rx="18" fill="#bbf7d0"/>
    <text x="360" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#15803d">Temperate: moderate seasons</text>

    <rect x="0" y="126" width="720" height="58" rx="18" fill="#fde68a"/>
    <text x="360" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b45309">Hot desert: very dry</text>

    <rect x="0" y="188" width="720" height="72" rx="18" fill="#86efac"/>
    <text x="360" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Tropical: hot near the Equator</text>

    <rect x="0" y="264" width="720" height="58" rx="18" fill="#fde68a"/>
    <text x="360" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b45309">Hot desert: very dry</text>

    <rect x="0" y="326" width="720" height="64" rx="18" fill="#bbf7d0"/>
    <text x="360" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#15803d">Temperate: moderate seasons</text>

    <rect x="0" y="394" width="720" height="54" rx="18" fill="#dbeafe"/>
    <text x="360" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Polar: very cold, ice and snow</text>

    <line x1="-34" y1="0" x2="-34" y2="448" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <polygon points="-34,-12 -48,12 -20,12" fill="#64748b"/>
    <polygon points="-34,460 -48,436 -20,436" fill="#64748b"/>
    <text x="-56" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" transform="rotate(-90 -56 27)">North Pole</text>
    <text x="-56" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569" transform="rotate(-90 -56 430)">South Pole</text>

    <line x1="0" y1="224" x2="720" y2="224" stroke="#ef4444" stroke-width="4" stroke-dasharray="12 10"/>
    <text x="695" y="214" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626">Equator</text>
  </g>
</svg>
