<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Migration push and pull factors</title>
  <desc id="desc">Push factors push people away from a dry rural area and pull factors attract them to a city.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b">Migration: Push &amp; Pull</text>
  <rect x="48" y="116" width="250" height="286" rx="28" fill="#ffedd5" stroke="#fb923c" stroke-width="4"/>
  <text x="173" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#9a3412">Push factors</text>
  <text x="173" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">make people leave</text>
  <circle cx="113" cy="226" r="28" fill="#facc15"/>
  <path d="M82 288 C122 262 164 262 204 288" stroke="#c2410c" stroke-width="7" fill="none"/>
  <path d="M86 322 H232" stroke="#c2410c" stroke-width="5" stroke-dasharray="14 12"/>
  <text x="173" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a3412">drought • no jobs</text>
  <g fill="#334155">
    <circle cx="360" cy="258" r="17"/>
    <path d="M330 322 C337 288 383 288 390 322 Z"/>
    <rect x="345" y="276" width="30" height="42" rx="12"/>
  </g>
  <path d="M294 259 C370 238 464 238 552 259" stroke="#2563eb" stroke-width="12" fill="none" marker-end="url(#arrow)"/>
  <text x="423" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">migration</text>
  <rect x="602" y="116" width="250" height="286" rx="28" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
  <text x="727" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Pull factors</text>
  <text x="727" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#14532d">attract people</text>
  <rect x="648" y="238" width="46" height="98" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="708" y="205" width="56" height="131" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="778" y="258" width="38" height="78" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
  <g fill="#eff6ff">
    <rect x="663" y="255" width="10" height="12"/><rect x="678" y="255" width="10" height="12"/><rect x="663" y="286" width="10" height="12"/><rect x="678" y="286" width="10" height="12"/>
    <rect x="725" y="225" width="11" height="13"/><rect x="744" y="225" width="11" height="13"/><rect x="725" y="262" width="11" height="13"/><rect x="744" y="262" width="11" height="13"/>
  </g>
  <path d="M636 346 H824" stroke="#475569" stroke-width="20"/>
  <text x="727" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">jobs • schools • clinics</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">
    <text x="173" y="440" text-anchor="middle">Problems push people away</text>
    <text x="727" y="440" text-anchor="middle">Opportunities pull people in</text>
  </g>
</svg>
