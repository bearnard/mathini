<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Population distribution map</title>
  <desc id="desc">A colourful map with dense dots near a city and sparse dots in dry and mountain areas.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b">Population Distribution</text>
  <path d="M151 128 C210 73 310 78 376 116 C434 150 489 116 566 132 C660 151 730 234 710 323 C692 406 599 455 496 432 C432 417 389 459 304 430 C204 396 120 323 118 230 C117 185 126 151 151 128 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <path d="M170 180 C225 160 287 162 332 196 C377 230 432 229 470 205 C535 164 637 196 676 266 C701 311 677 365 628 392 C562 428 514 376 459 399 C390 428 329 433 261 397 C188 358 142 288 159 221 Z" fill="#dcfce7" opacity="0.9"/>
  <path d="M138 301 C192 292 245 298 298 322 C353 347 399 349 448 332 C514 309 582 330 676 363 C639 421 565 449 496 432 C432 417 389 459 304 430 C224 403 153 351 138 301 Z" fill="#fef3c7" opacity="0.9"/>
  <path d="M146 152 C184 107 265 89 335 105 C294 142 244 151 211 189 C177 228 167 267 138 301 C116 240 117 190 146 152 Z" fill="#fed7aa" opacity="0.85"/>
  <g fill="#7c2d12" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="216" y="146">Sparse</text>
    <text x="224" y="168">dry area</text>
  </g>
  <g fill="#14532d" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="522" y="251">Dense</text>
    <text x="506" y="273">city area</text>
  </g>
  <g fill="#0f172a">
    <circle cx="523" cy="291" r="6"/><circle cx="544" cy="296" r="6"/><circle cx="565" cy="288" r="6"/><circle cx="587" cy="304" r="6"/>
    <circle cx="512" cy="319" r="6"/><circle cx="537" cy="325" r="6"/><circle cx="559" cy="318" r="6"/><circle cx="582" cy="333" r="6"/>
    <circle cx="606" cy="321" r="6"/><circle cx="498" cy="350" r="6"/><circle cx="525" cy="353" r="6"/><circle cx="552" cy="346" r="6"/>
    <circle cx="578" cy="360" r="6"/><circle cx="604" cy="351" r="6"/><circle cx="632" cy="367" r="6"/><circle cx="470" cy="309" r="6"/>
    <circle cx="490" cy="275" r="6"/><circle cx="619" cy="288" r="6"/><circle cx="644" cy="321" r="6"/><circle cx="455" cy="344" r="6"/>
  </g>
  <g fill="#475569">
    <circle cx="228" cy="222" r="6"/><circle cx="284" cy="177" r="6"/><circle cx="318" cy="256" r="6"/><circle cx="230" cy="332" r="6"/>
    <circle cx="356" cy="382" r="6"/><circle cx="420" cy="238" r="6"/><circle cx="639" cy="220" r="6"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
    <rect x="673" y="92" width="176" height="102" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="704" cy="123" r="6" fill="#0f172a"/><text x="724" y="129">many dots = dense</text>
    <circle cx="704" cy="162" r="6" fill="#475569"/><text x="724" y="168">few dots = sparse</text>
  </g>
