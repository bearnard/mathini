    <path d="M19 31h48a10 10 0 0 1 10 10v25a10 10 0 0 1-10 10H42L23 94v-18h-4A10 10 0 0 1 9 66V41a10 10 0 0 1 10-10z" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
