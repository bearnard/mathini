    <path d="M24 25h40M24 45h38M24 65h28" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 96c14-12 28 12 46 0" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <text x="43" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">Written</text>
  </g>

  <g transform="translate(154 72)">
