<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Historical source types</title>
  <desc id="desc">Four colourful icons showing written, visual, oral, and object sources.</desc>
