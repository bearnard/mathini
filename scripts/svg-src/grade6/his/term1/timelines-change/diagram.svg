<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Timeline and change</title>
  <desc id="desc">A horizontal timeline with marked dates and community events in order.</desc>
  <rect width="480" height="320" fill="white"/>
  <text x="240" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Timeline: earliest to latest</text>

  <line x1="58" y1="164" x2="422" y2="164" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <path d="M422 164l-18-13v26z" fill="#475569"/>

  <g transform="translate(84 0)">
    <line x1="0" y1="132" x2="0" y2="196" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="164" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <rect x="-52" y="78" width="104" height="42" rx="12" fill="#dbeafe"/>
    <text x="0" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">1900</text>
    <text x="0" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Village</text>
    <text x="0" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">founded</text>
  </g>

  <g transform="translate(188 0)">
    <line x1="0" y1="132" x2="0" y2="196" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="164" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <rect x="-52" y="208" width="104" height="42" rx="12" fill="#dcfce7"/>
    <text x="0" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">1930</text>
    <text x="0" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">New</text>
    <text x="0" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">school</text>
  </g>

  <g transform="translate(292 0)">
    <line x1="0" y1="132" x2="0" y2="196" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="164" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <rect x="-52" y="78" width="104" height="42" rx="12" fill="#fef3c7"/>
    <text x="0" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">1975</text>
    <text x="0" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Library</text>
    <text x="0" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">opens</text>
  </g>

  <g transform="translate(396 0)">
    <line x1="0" y1="132" x2="0" y2="196" stroke="#9333ea" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="164" r="13" fill="#f3e8ff" stroke="#9333ea" stroke-width="4"/>
    <rect x="-52" y="208" width="104" height="42" rx="12" fill="#f3e8ff"/>
    <text x="0" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#6b21a8">2020</text>
    <text x="0" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Community</text>
    <text x="0" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">project</text>
  </g>
