<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Cape Colony expanding toward the eastern frontier</title>
  <desc id="desc">A simple colourful map showing Cape Colony in the west, an eastward expansion arrow, and a meeting marker near Xhosa communities.</desc>
  <defs>
    <marker id="arrow" markerWidth="44" markerHeight="44" refX="30" refY="22" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M6 6 L36 22 L6 38 Z" fill="#f97316" />
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="900" height="560" rx="28" fill="#f8fafc" />
  <path d="M40 380 C140 335 220 360 300 315 C382 270 455 286 535 240 C620 190 720 190 850 145 L850 500 L40 500 Z" fill="#d9f99d" />
  <path d="M38 382 C145 338 222 358 300 315 C382 270 455 286 535 240 C620 190 720 190 852 146" fill="none" stroke="#65a30d" stroke-width="5" />
  <path d="M40 455 C150 420 220 415 310 385 C400 350 480 335 555 295 L555 500 L40 500 Z" fill="#bae6fd" opacity="0.75" />
  <path d="M80 425 C170 395 265 390 345 360 C420 330 485 315 555 295 L555 500 L80 500 Z" fill="#fde68a" stroke="#f59e0b" stroke-width="4" filter="url(#softShadow)" />
  <text x="250" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#92400e">Cape Colony</text>
  <text x="715" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#166534">Xhosa communities</text>
  <line x1="385" y1="318" x2="520" y2="270" stroke="#f97316" stroke-width="14" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="452" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c2410c">expansion east</text>
  <circle cx="625" cy="262" r="30" fill="#ef4444" stroke="#fff" stroke-width="8" filter="url(#softShadow)" />
  <text x="625" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="900" fill="#fff">!</text>
  <text x="625" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#991b1b">meeting point</text>
  <path d="M730 386 c20 -35 60 -35 80 0" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" />
  <circle cx="730" cy="386" r="8" fill="#2563eb" />
  <circle cx="810" cy="386" r="8" fill="#2563eb" />
  <text x="770" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">Great Fish River area</text>
  <circle cx="122" cy="118" r="42" fill="#fbbf24" opacity="0.9" />
  <text x="450" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#0f172a">Eastern Frontier Conflicts</text>
</svg>
