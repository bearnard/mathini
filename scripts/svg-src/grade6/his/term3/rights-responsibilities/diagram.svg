<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Rights, responsibilities and government</title>
  <desc id="desc">Three levels of government beside a two-column rights and responsibilities layout.</desc>
  <rect width="900" height="560" rx="36" fill="#f8fafc"/>
  <circle cx="100" cy="90" r="70" fill="#ede9fe"/>
  <circle cx="812" cy="480" r="82" fill="#ffedd5"/>

  <g transform="translate(70 78)" font-family="Arial, sans-serif">
    <text x="170" y="0" text-anchor="middle" font-size="26" font-weight="700" fill="#334155">Government levels</text>
    <rect x="50" y="36" width="240" height="78" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <text x="170" y="84" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a">National</text>
    <rect x="35" y="148" width="270" height="78" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
    <text x="170" y="196" text-anchor="middle" font-size="25" font-weight="700" fill="#4c1d95">Provincial</text>
    <rect x="20" y="260" width="300" height="78" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="5"/>
    <text x="170" y="308" text-anchor="middle" font-size="25" font-weight="700" fill="#881337">Local / Municipal</text>
    <path d="M170 114 V148 M170 226 V260" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(438 92)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="350" height="364" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="6"/>
    <rect x="0" y="0" width="175" height="70" rx="24" fill="#bbf7d0"/>
    <path d="M151 0 H175 V70 H0 V24 A24 24 0 0 1 24 0 Z" fill="#bbf7d0"/>
    <rect x="175" y="0" width="175" height="70" rx="24" fill="#fed7aa"/>
    <path d="M175 0 H326 A24 24 0 0 1 350 24 V70 H175 Z" fill="#fed7aa"/>
    <line x1="175" y1="0" x2="175" y2="364" stroke="#cbd5e1" stroke-width="5"/>
    <text x="87" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">Rights</text>
    <text x="262" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#9a3412">Responsibilities</text>
    <text x="28" y="118" font-size="22" fill="#166534">✓ Education</text>
    <text x="28" y="166" font-size="22" fill="#166534">✓ Safety</text>
    <text x="28" y="214" font-size="22" fill="#166534">✓ Freedom</text>
    <text x="203" y="118" font-size="22" fill="#9a3412">✓ Respect</text>
    <text x="203" y="166" font-size="22" fill="#9a3412">✓ Obey laws</text>
    <text x="203" y="214" font-size="22" fill="#9a3412">✓ Help others</text>
    <rect x="74" y="268" width="202" height="54" rx="16" fill="#e0f2fe"/>
    <text x="175" y="303" text-anchor="middle" font-size="22" font-weight="700" fill="#075985">Good citizens</text>
  </g>
</svg>
