<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Constitution and Bill of Rights</title>
  <desc id="desc">A colourful Constitution document and Bill of Rights shield with a short list of protected rights.</desc>
  <rect width="900" height="560" rx="36" fill="#f8fafc"/>
  <circle cx="140" cy="95" r="72" fill="#dbeafe"/>
  <circle cx="782" cy="462" r="88" fill="#dcfce7"/>

  <g transform="translate(145 70)">
    <rect x="0" y="0" width="350" height="430" rx="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="8"/>
    <rect x="28" y="32" width="294" height="72" rx="16" fill="#bfdbfe"/>
    <text x="175" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Constitution</text>
    <line x1="58" y1="150" x2="292" y2="150" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
    <line x1="58" y1="192" x2="292" y2="192" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
    <line x1="58" y1="234" x2="244" y2="234" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
    <rect x="78" y="300" width="194" height="74" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="5"/>
    <text x="175" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">Highest law</text>
  </g>

  <g transform="translate(532 105)">
    <path d="M120 0 L236 40 V156 C236 226 188 285 120 318 C52 285 4 226 4 156 V40 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="8"/>
    <path d="M120 30 L205 60 V152 C205 202 171 246 120 275 C69 246 35 202 35 152 V60 Z" fill="#bbf7d0"/>
    <text x="120" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Bill of</text>
    <text x="120" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Rights</text>
    <circle cx="82" cy="188" r="10" fill="#16a34a"/>
    <circle cx="120" cy="202" r="10" fill="#16a34a"/>
    <circle cx="158" cy="188" r="10" fill="#16a34a"/>
  </g>

  <g transform="translate(540 392)" font-family="Arial, sans-serif" font-size="22" fill="#334155">
    <rect x="0" y="0" width="220" height="96" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="5"/>
    <text x="32" y="39">✓ Equality</text>
    <text x="32" y="73">✓ Dignity</text>
    <text x="132" y="39">✓ Safety</text>
    <text x="132" y="73">✓ Freedom</text>
  </g>
</svg>
