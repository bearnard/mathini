<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 520"><title>Four ideas in European medicine</title><desc>Four icons in a row: hospitals, germ theory, hygiene, and vaccines. They are ideas, not in date order.</desc><rect width="900" height="520" fill="#f8fafc" rx="36"/><text x="450" y="60" fill="#1e293b" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Medical discoveries</text><path stroke="#94a3b8" stroke-linecap="round" stroke-width="10" d="M120 260h660"/><g transform="translate(120 260)"><circle r="42" fill="#38bdf8" stroke="#0369a1" stroke-width="5"/><rect width="40" height="36" x="-20" y="-18" fill="#fff" rx="5"/><path fill="#ef4444" d="M-6-32H6v64H-6z"/><path fill="#ef4444" d="M-32-6h64V6h-64z"/><text y="82" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Hospitals</text><text y="112" fill="#475569" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">care for patients</text></g><g transform="translate(340 260)"><circle r="42" fill="#f87171" stroke="#b91c1c" stroke-width="5"/><circle r="18" fill="#fff"/><circle cx="-19" cy="-18" r="7" fill="#fff"/><circle cx="22" cy="-9" r="6" fill="#fff"/><circle cx="10" cy="22" r="8" fill="#fff"/><path stroke="#fff" stroke-linecap="round" stroke-width="5" d="M-34 0h68M0-34v68"/><text y="82" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Germ theory</text><text y="112" fill="#475569" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">germs cause disease</text></g><g transform="translate(560 260)"><circle r="42" fill="#34d399" stroke="#047857" stroke-width="5"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="7" d="M-24 7c18 22 42 22 60-6"/><circle cx="-20" cy="-12" r="8" fill="#fff"/><circle cx="8" cy="-21" r="10" fill="#fff"/><circle cx="29" cy="-4" r="7" fill="#fff"/><text y="82" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Hygiene</text><text y="112" fill="#475569" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">clean hands and wards</text></g><g transform="translate(780 260)"><circle r="42" fill="#a78bfa" stroke="#6d28d9" stroke-width="5"/><rect width="16" height="48" x="-8" y="-30" fill="#fff" rx="5" transform="rotate(-35)"/><path stroke="#fff" stroke-linecap="round" stroke-width="5" d="m13-22 26-26m-57 69-13 13"/><text y="82" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Vaccines</text><text y="112" fill="#475569" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">prevent some diseases</text></g></svg>