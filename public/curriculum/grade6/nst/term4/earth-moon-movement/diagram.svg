<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 1000 620"><title>Earth and Moon movement</title><desc>Earth revolves around the Sun, rotates on its axis, and the Moon orbits Earth.</desc><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#334155" d="m0 0 10 5-10 5z"/></marker><marker id="b" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="m0 0 10 5-10 5z"/></marker></defs><path fill="#f8fafc" d="M0 0h1000v620H0z"/><circle cx="150" cy="310" r="72" fill="#fbbf24"/><circle cx="150" cy="310" r="48" fill="#f97316" opacity=".4"/><text x="150" y="415" fill="#92400e" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Sun</text><ellipse cx="520" cy="310" fill="none" stroke="#94a3b8" stroke-dasharray="12 10" stroke-width="4" rx="340" ry="205"/><path fill="none" stroke="#334155" stroke-width="5" marker-end="url(#a)" d="M842 250a340 205 0 0 1-34 136"/><text x="525" y="92" fill="#334155" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">revolution: Earth orbits the Sun once a year</text><g transform="translate(655 385)"><circle r="62" fill="#2563eb"/><path fill="none" stroke="#22c55e" stroke-linecap="round" stroke-width="9" d="M-40-15c25 16 55 14 83-4m-75 47c28-12 56-11 82 5"/><path stroke="#0f172a" stroke-linecap="round" stroke-width="4" d="M-28-78 28 78"/><path fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#b)" d="M-50-82a64 64 0 0 1 98 8"/><text y="105" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Earth</text><text y="135" fill="#1e40af" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">rotation: spins once a day</text><ellipse fill="none" stroke="#64748b" stroke-dasharray="8 8" stroke-width="3" rx="130" ry="86"/><path fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)" d="M112-38a130 86 0 0 1 14 53"/><circle cx="135" r="20" fill="#cbd5e1"/><text x="165" y="7" fill="#475569" font-family="Arial, sans-serif" font-size="22" font-weight="700">Moon</text><text y="-112" fill="#475569" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Moon orbits Earth about monthly</text></g></svg>