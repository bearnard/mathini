<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 600"><title>Mains electricity route</title><desc>Electricity travels from a power station along power lines on pylons to a house, with a save electricity note.</desc><path fill="#f8fafc" d="M0 0h900v600H0z"/><text x="450" y="55" fill="#0f172a" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">Mains electricity reaches homes and schools</text><path fill="#e2e8f0" stroke="#64748b" stroke-width="4" d="M70 330h190v130H70z"/><path fill="#cbd5e1" stroke="#64748b" stroke-width="4" d="M95 290h45v170H95zm70-30h45v200h-45z"/><path fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-width="7" d="M105 275c-15-30 25-40 15-70m57 40c-17-27 28-40 17-70"/><text x="165" y="500" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Power station</text><g fill="none" stroke="#475569" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"><path d="m365 455 50-235 50 235Zm20-95h60m-70 55h80m-57-195h34"/><path d="m405 455 10-95 10 95"/></g><text x="415" y="500" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Pylon</text><g fill="none" stroke="#475569" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"><path d="m570 455 50-235 50 235Zm20-95h60m-70 55h80m-57-195h34"/><path d="m610 455 10-95 10 95"/></g><text x="620" y="500" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Power lines</text><path stroke="#2563eb" stroke-linecap="round" stroke-width="5" d="m210 230 205-10m-205 35 205-10m0-25h205m-205 25h205"/><path stroke="#2563eb" stroke-linecap="round" stroke-width="5" marker-end="url(#a)" d="m620 220 150 100"/><path stroke="#2563eb" stroke-linecap="round" stroke-width="5" d="m620 245 150 100"/><text x="450" y="190" fill="#2563eb" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">electricity travels this way</text><path fill="#fecaca" stroke="#b91c1c" stroke-width="4" d="m710 355 85-70 85 70z"/><path fill="#fee2e2" stroke="#b91c1c" stroke-width="4" d="M730 355h130v100H730z"/><path fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" d="M780 395h35v60h-35z"/><path fill="#fef3c7" stroke="#ca8a04" stroke-width="3" d="M742 375h30v28h-30zm81 0h30v28h-30z"/><text x="795" y="500" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Home / school</text><rect width="270" height="58" x="315" y="95" fill="#ecfdf5" stroke="#22c55e" stroke-width="4" rx="18"/><text x="450" y="131" fill="#166534" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Save electricity: switch off</text><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="m0 0 10 5-10 5z"/></marker></defs></svg>