<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 600"><title>Closed electric circuit</title><desc>A simple closed circuit loop with labelled cell, bulb, switch and wires.</desc><path fill="#f8fafc" d="M0 0h900v600H0z"/><text x="450" y="55" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">Simple closed circuit</text><path fill="none" stroke="#334155" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" d="M210 300h120m60 0h120m60 0h120m0 0v140H210V300"/><path stroke="#0f172a" stroke-linecap="round" stroke-width="10" d="M330 250v100"/><path stroke="#0f172a" stroke-linecap="round" stroke-width="6" d="M390 270v60"/><text x="360" y="215" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Cell</text><text x="360" y="382" fill="#475569" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">energy source</text><circle cx="540" cy="300" r="50" fill="#fef3c7" stroke="#92400e" stroke-width="8"/><path stroke="#92400e" stroke-linecap="round" stroke-width="6" d="m510 270 60 60m0-60-60 60"/><path fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-width="6" d="M515 250q25-25 50 0"/><text x="540" y="215" fill="#b45309" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Bulb</text><text x="540" y="382" fill="#475569" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">lights up</text><circle cx="210" cy="300" r="8" fill="#0f172a"/><circle cx="210" cy="440" r="8" fill="#0f172a"/><path stroke="#16a34a" stroke-linecap="round" stroke-width="10" d="m210 300 60 140"/><text x="170" y="230" fill="#15803d" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Closed switch</text><text x="170" y="255" fill="#475569" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">path is joined</text><text x="450" y="485" fill="#334155" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Connecting wires make a complete path for current</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-width="5" marker-end="url(#a)" d="M715 410c30-20 48-54 48-92"/><text x="745" y="458" fill="#2563eb" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">current flows</text><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="m0 0 10 5-10 5z"/></marker></defs></svg>