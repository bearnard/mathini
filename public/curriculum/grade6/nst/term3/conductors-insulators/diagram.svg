<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 600"><title>Conductors and insulators test circuit</title><desc>A test circuit with a gap for test material, a lit bulb for a conductor, and examples of conductors and insulators.</desc><path fill="#f8fafc" d="M0 0h900v600H0z"/><text x="450" y="55" fill="#0f172a" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">Testing conductors and insulators</text><path fill="none" stroke="#334155" stroke-linecap="round" stroke-linejoin="round" stroke-width="11" d="M155 325v130h210M395 455h295V325"/><path fill="none" stroke="#334155" stroke-linecap="round" stroke-width="11" d="M155 325h145m120 0h90m100 0h80"/><path stroke="#0f172a" stroke-linecap="round" stroke-width="5" d="M365 420v70"/><path stroke="#0f172a" stroke-linecap="round" stroke-width="10" d="M395 437v36"/><text x="380" y="520" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Cell</text><circle cx="560" cy="325" r="50" fill="#fde68a" stroke="#b45309" stroke-width="8"/><path stroke="#b45309" stroke-linecap="round" stroke-width="6" d="m530 295 60 60m0-60-60 60"/><path fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-width="7" d="M520 275q40-43 80 0"/><text x="560" y="238" fill="#b45309" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Bulb lit</text><text x="560" y="404" fill="#475569" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">test item conducts</text><rect width="120" height="66" x="300" y="292" fill="#bbf7d0" stroke="#15803d" stroke-width="5" rx="12"/><text x="360" y="319" fill="#166534" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Test</text><text x="360" y="342" fill="#166534" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">material</text><text x="360" y="260" fill="#15803d" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Conductor in gap</text><rect width="330" height="115" x="75" y="95" fill="#ecfdf5" stroke="#22c55e" stroke-width="4" rx="20"/><text x="240" y="130" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Conductors</text><text x="240" y="164" fill="#166534" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Most metals let current pass</text><text x="240" y="193" fill="#166534" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">copper • aluminium • iron</text><rect width="330" height="115" x="495" y="95" fill="#fff1f2" stroke="#fb7185" stroke-width="4" rx="20"/><text x="660" y="130" fill="#be123c" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Insulators</text><text x="660" y="164" fill="#be123c" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Do not let current pass easily</text><text x="660" y="193" fill="#be123c" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">plastic • rubber • dry wood • glass</text><text x="450" y="540" fill="#334155" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">If the bulb is off, the test material is an insulator</text></svg>