<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 960 360"><title>Grass to springbok to lion food chain</title><desc>A labelled food chain diagram showing energy flowing from grass to springbok to lion.</desc><defs><marker id="a" markerHeight="14" markerUnits="strokeWidth" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#475569" d="m2 2 10 5-10 5Z"/></marker></defs><path fill="#f8fafc" d="M0 0h960v360H0z"/><text x="480" y="42" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Food chain: energy flows to the eater</text><g transform="translate(95 95)"><rect width="180" height="170" fill="#dcfce7" stroke="#22c55e" stroke-width="3" rx="24"/><path fill="none" stroke="#16a34a" stroke-linecap="round" stroke-width="8" d="M35 120c10-32 23-44 35 0"/><path fill="none" stroke="#15803d" stroke-linecap="round" stroke-width="9" d="M75 120c10-50 28-65 37 0"/><path fill="none" stroke="#16a34a" stroke-linecap="round" stroke-width="8" d="M115 120c10-34 27-48 35 0"/><path stroke="#65a30d" stroke-linecap="round" stroke-width="6" d="M28 124h126"/><text x="90" y="153" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Grass</text><text x="90" y="184" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">producer</text></g><path stroke="#475569" stroke-width="6" marker-end="url(#a)" d="M305 180h100"/><text x="355" y="160" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">eaten by</text><g transform="translate(415 95)"><rect width="180" height="170" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" rx="24"/><ellipse cx="92" cy="78" fill="#c08457" rx="47" ry="26"/><circle cx="132" cy="62" r="19" fill="#c08457"/><path stroke="#92400e" stroke-linecap="round" stroke-width="5" d="m130 42-4-22m14 24 11-20"/><circle cx="138" cy="58" r="3" fill="#111827"/><path stroke="#92400e" stroke-linecap="round" stroke-width="6" d="m55 98-10 28m33-26-3 28m33-28 4 28m16-33 12 27"/><path fill="none" stroke="#92400e" stroke-linecap="round" stroke-width="5" d="M50 72c-16-10-17-25-2-30"/><text x="90" y="153" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Springbok</text><text x="90" y="184" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">herbivore</text></g><path stroke="#475569" stroke-width="6" marker-end="url(#a)" d="M625 180h100"/><text x="675" y="160" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">eaten by</text><g transform="translate(735 95)"><rect width="180" height="170" fill="#fee2e2" stroke="#ef4444" stroke-width="3" rx="24"/><ellipse cx="85" cy="80" fill="#d97706" rx="50" ry="27"/><circle cx="132" cy="63" r="25" fill="#d97706"/><circle cx="132" cy="63" r="33" fill="none" stroke="#92400e" stroke-width="10"/><circle cx="124" cy="58" r="3" fill="#111827"/><circle cx="140" cy="58" r="3" fill="#111827"/><path fill="none" stroke="#111827" stroke-linecap="round" stroke-width="3" d="M129 69q3 3 6 0"/><path stroke="#92400e" stroke-linecap="round" stroke-width="6" d="m48 98-10 28m40-24-6 28m36-30 6 28m11-35 13 28"/><path fill="none" stroke="#92400e" stroke-linecap="round" stroke-width="6" d="M40 73c-22-8-20-28 2-31"/><text x="90" y="153" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Lion</text><text x="90" y="184" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">carnivore</text></g><text x="480" y="325" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">Arrows show the direction of energy flow.</text></svg>