<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 480 320"><title>Grid-reference map</title><desc>A simple lettered and numbered grid map with a school, clinic, park, road, and river.</desc><path fill="#f8fafc" d="M0 0h480v320H0z"/><text x="240" y="32" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Locating places with a grid</text><g transform="translate(78 58)"><path fill="#fff" stroke="#334155" stroke-width="3" d="M0 0h300v210H0z"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="9" d="M0 154c40-24 74 24 112-4 46-34 86-8 188-42" opacity=".75"/><path fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-width="8" d="m16 40 268 140"/><rect width="44" height="34" x="114" y="28" fill="#fbbf24" stroke="#92400e" stroke-width="2" rx="4"/><text x="136" y="51" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">School</text><rect width="44" height="34" x="210" y="128" fill="#fecdd3" stroke="#be123c" stroke-width="2" rx="4"/><text x="232" y="151" fill="#be123c" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Clinic</text><circle cx="55" cy="92" r="19" fill="#86efac" stroke="#16a34a" stroke-width="3"/><text x="55" y="120" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Park</text><path stroke="#cbd5e1" stroke-width="2" d="M75 0v210M150 0v210M225 0v210M0 70h300M0 140h300"/><g fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle"><text x="37.5" y="-14">A</text><text x="112.5" y="-14">B</text><text x="187.5" y="-14">C</text><text x="262.5" y="-14">D</text><text x="-18" y="41">1</text><text x="-18" y="111">2</text><text x="-18" y="181">3</text></g></g><g fill="#334155" font-family="Inter, Arial, sans-serif" font-size="13" transform="translate(395 8