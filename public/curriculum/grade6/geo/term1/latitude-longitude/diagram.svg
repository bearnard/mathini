<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 480 320"><title>Globe showing latitude and longitude</title><desc>A globe with horizontal latitude lines, vertical longitude lines, the Equator, the Greenwich Meridian, and hemisphere labels.</desc><path fill="#f8fafc" d="M0 0h480v320H0z"/><text x="240" y="32" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Latitude &amp; longitude</text><g transform="translate(240 168)"><circle r="112" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><clipPath id="a"><circle r="108"/></clipPath><g clip-path="url(#a)"><path fill="#86efac" d="M-88-30c32-30 60-25 84-42 28-20 72 2 88 36C54-20 30-22 4-12-28 0-58-4-88-30" opacity=".95"/><path fill="#bbf7d0" d="M-86 38c34-20 70-10 100-22 28-10 56 4 76 30C58 82 10 88-28 70c-24-12-40-12-58-32" opacity=".95"/><ellipse fill="none" stroke="#0284c7" stroke-width="2" rx="108" ry="28"/><ellipse cy="-45" fill="none" stroke="#38bdf8" stroke-width="2" rx="94" ry="19"/><ellipse cy="45" fill="none" stroke="#38bdf8" stroke-width="2" rx="94" ry="19"/><path stroke="#ef4444" stroke-width="4" d="M-108 0h216"/><ellipse fill="none" stroke="#7c3aed" stroke-width="2" rx="32" ry="108"/><ellipse fill="none" stroke="#a78bfa" stroke-width="2" rx="70" ry="108"/><path stroke="#7c2d12" stroke-width="4" d="M0-108v216"/></g><text x="-146" y="5" fill="#dc2626" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Equator</text><text x="92" y="-94" fill="#7c2d12" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Greenwich</text><text x="92" y="-76" fill="#7c2d12" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Meridian</text><text y="-126" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Northern Hemisphere</text><text y="144" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Southern Hemisphere</text></g><text x="98" y="288" fill="#0284c7" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">latitude = horizontal</text><text x="374" y="288" fill="#7c3aed" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">longitude = vertical</text></svg>