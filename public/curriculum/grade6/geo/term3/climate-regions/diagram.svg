<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 520"><title>Climate belts from Equator to poles</title><desc>A colourful labelled cross-section showing polar, temperate, desert, and tropical climate zones from north pole through the Equator to south pole.</desc><rect width="900" height="520" fill="#f8fafc" rx="28"/><text x="450" y="48" fill="#1e293b" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Climate regions by latitude</text><g transform="translate(90 85)"><rect width="720" height="54" fill="#dbeafe" rx="18"/><text x="360" y="35" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Polar: very cold, ice and snow</text><rect width="720" height="64" y="58" fill="#bbf7d0" rx="18"/><text x="360" y="98" fill="#15803d" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Temperate: moderate seasons</text><rect width="720" height="58" y="126" fill="#fde68a" rx="18"/><text x="360" y="162" fill="#b45309" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Hot desert: very dry</text><rect width="720" height="72" y="188" fill="#86efac" rx="18"/><text x="360" y="233" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Tropical: hot near the Equator</text><rect width="720" height="58" y="264" fill="#fde68a" rx="18"/><text x="360" y="300" fill="#b45309" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Hot desert: very dry</text><rect width="720" height="64" y="326" fill="#bbf7d0" rx="18"/><text x="360" y="366" fill="#15803d" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Temperate: moderate seasons</text><rect width="720" height="54" y="394" fill="#dbeafe" rx="18"/><text x="360" y="429" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Polar: very cold, ice and snow</text><path stroke="#64748b" stroke-linecap="round" stroke-width="4" d="M-34 0v448"/><path fill="#64748b" d="m-34-12-14 24h28zm0 472-14-24h28z"/><text x="-56" y="27" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 -56 27)">North Pole</text><text x="-56" y="430" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 -56 430)">South Pole</text><path stroke="#ef4444" stroke-dasharray="12 10" stroke-width="4" d="M0 224h720"/><text x="695" y="214" fill="#dc2626" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end">Equator</text></g></svg>