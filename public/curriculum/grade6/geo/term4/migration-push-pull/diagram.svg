<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 520"><title>Migration push and pull factors</title><desc>Push factors push people away from a dry rural area and pull factors attract them to a city.</desc><defs><marker id="a" markerHeight="40" markerUnits="userSpaceOnUse" markerWidth="40" orient="auto" refX="28" refY="20"><path fill="#2563eb" d="m4 4 28 16L4 36Z"/></marker></defs><path fill="#f8fafc" d="M0 0h900v520H0z"/><text x="450" y="42" fill="#1e293b" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Migration: Push &amp; Pull</text><rect width="250" height="286" x="48" y="116" fill="#ffedd5" stroke="#fb923c" stroke-width="4" rx="28"/><text x="173" y="154" fill="#9a3412" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Push factors</text><text x="173" y="180" fill="#7c2d12" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">make people leave</text><circle cx="113" cy="226" r="28" fill="#facc15"/><path fill="none" stroke="#c2410c" stroke-width="7" d="M82 288c40-26 82-26 122 0"/><path stroke="#c2410c" stroke-dasharray="14 12" stroke-width="5" d="M86 322h146"/><text x="173" y="356" fill="#9a3412" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">drought • no jobs</text><g fill="#334155" transform="translate(0 56)"><circle cx="360" cy="258" r="17"/><path d="M330 322c7-34 53-34 60 0Z"/><rect width="30" height="42" x="345" y="276" rx="12"/></g><path fill="none" stroke="#2563eb" stroke-width="12" marker-end="url(#a)" d="M294 259c76-21 170-21 258 0"/><text x="423" y="222" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">migration</text><rect width="250" height="286" x="602" y="116" fill="#dcfce7" stroke="#22c55e" stroke-width="4" rx="28"/><text x="727" y="154" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Pull factors</text><text x="727" y="180" fill="#14532d" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">attract people</text><path fill="#93c5fd" stroke="#1d4ed8" stroke-width="3" d="M648 238h46v98h-46z"/><path fill="#60a5fa" stroke="#1d4ed8" stroke-width="3" d="M708 205h56v131h-56z"/><path fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" d="M778 258h38v78h-38z"/><path fill="#eff6ff" d="M663 255h10v12h-10zm15 0h10v12h-10zm-15 31h10v12h-10zm15 0h10v12h-10zm47-61h11v13h-11zm19 0h11v13h-11zm-19 37h11v13h-11zm19 0h11v13h-11z"/><path stroke="#475569" stroke-width="20" d="M636 346h188"/><text x="727" y="378" fill="#166534" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">jobs • schools • clinics</text><g fill="#334155" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle"><text x="173" y="440">Problems push people away</text><text x="727" y="440">Opportunities pull people in</text></g></svg>